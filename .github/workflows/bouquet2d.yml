name: Bouquet2D

# Builds the Bouquet2D desktop app (bouquet2d/desktop/) for Linux, Windows and macOS, with the server
# built by "make PORTABLE=1" and checked against GUDHI (bouquet2d/server/test_server.py). Each run keeps
# the apps as artifacts of the run (Actions tab); pushing a tag bouquet2d-v* (e.g. bouquet2d-v0.1.0, with
# the version in bouquet2d/desktop/package.json) also attaches them to a GitHub release of that tag.
on:
  push:
    tags: ['bouquet2d-v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # its glibc (2.35) is older than most, so the server runs on those too
            targets: --linux
          - os: windows-latest
            targets: --win
          - os: macos-latest # the server is built for both Apple silicon and Intel
            targets: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: bouquet2d
    steps:
      - uses: actions/checkout@v7

      - name: Server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          make -C server PORTABLE=1
          ldd server/server

      - name: Server (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          brew install boost
          make -C server PORTABLE=1 CXX=clang++ CXXFLAGS="-std=c++17 -O3 -pthread -arch arm64 -arch x86_64" \
            CPPFLAGS="-I$(brew --prefix boost)/include"
          lipo -info server/server
          otool -L server/server

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-boost

      - name: Server (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make -C server PORTABLE=1
          ldd server/server.exe

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the server against GUDHI
        run: |
          python -m pip install numpy gudhi
          cd server && python test_server.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Desktop app
        working-directory: bouquet2d/desktop
        run: |
          npm ci
          npx electron-builder ${{ matrix.targets }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Bouquet2D-${{ runner.os }}
          path: |
            bouquet2d/desktop/dist/*.AppImage
            bouquet2d/desktop/dist/*.exe
            bouquet2d/desktop/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/bouquet2d-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Bouquet2D ${GITHUB_REF_NAME#bouquet2d-}" --generate-notes
